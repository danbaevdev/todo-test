name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; new pushes cancel the in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Any failure here fails the job, so the `deploy` job (needs: build)
      # is skipped and nothing ships.
      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run lint:style

      - name: Unit & component tests
        run: npm run test

      - name: Generate static site
        run: npm run generate
        env:
          # served from https://<user>.github.io/todo-test/
          NUXT_APP_BASE_URL: /todo-test/

      - name: Disable Jekyll (keep the _nuxt/ folder)
        run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
